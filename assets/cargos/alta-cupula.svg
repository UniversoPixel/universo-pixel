<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Ouro principal -->
    <linearGradient id="gold" x1="58" y1="46" x2="198" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7B0"/>
      <stop offset="0.2" stop-color="#FFD95A"/>
      <stop offset="0.48" stop-color="#F2B72B"/>
      <stop offset="0.76" stop-color="#C88712"/>
      <stop offset="1" stop-color="#855308"/>
    </linearGradient>

    <!-- Ouro claro -->
    <linearGradient id="goldLight" x1="79" y1="71" x2="177" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE4"/>
      <stop offset="0.3" stop-color="#FFE97A"/>
      <stop offset="0.68" stop-color="#F4BE35"/>
      <stop offset="1" stop-color="#B8730D"/>
    </linearGradient>

    <!-- Azul profundo do brasão -->
    <linearGradient id="blue" x1="79" y1="75" x2="178" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DD4FF"/>
      <stop offset="0.3" stop-color="#2196D8"/>
      <stop offset="0.65" stop-color="#1167A7"/>
      <stop offset="1" stop-color="#073B69"/>
    </linearGradient>

    <!-- Azul escuro -->
    <linearGradient id="blueDark" x1="90" y1="105" x2="165" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B5B91"/>
      <stop offset="1" stop-color="#052C50"/>
    </linearGradient>

    <!-- Sombra -->
    <linearGradient id="shadow" x1="78" y1="166" x2="181" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9680A"/>
      <stop offset="1" stop-color="#603905"/>
    </linearGradient>

    <!-- Reflexo -->
    <linearGradient id="shine" x1="80" y1="69" x2="156" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowBlur" x="22" y="25" width="212" height="216" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="42" y="28" width="172" height="190" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Brilho externo -->
  <path
    d="M128 34L146 52L171 47L175 72L199 83L185 104L193 130L173 143L169 174L146 179L128 201L110 179L87 174L83 143L63 130L71 104L57 83L81 72L85 47L110 52L128 34Z"
    fill="#39BFFF"
    opacity="0.2"
    filter="url(#glow)"
  />

  <!-- Sombra projetada -->
  <path
    d="M63 164L78 202L178 202L193 164L178 179L170 204H86L78 179L63 164Z"
    fill="#000"
    opacity="0.18"
  />

  <g filter="url(#shadowBlur)">

    <!-- Parte traseira do brasão -->
    <path
      d="M128 43L151 61L178 56L181 83L204 96L190 119L194 147L174 161L168 190L145 193L128 210L111 193L88 190L82 161L62 147L66 119L52 96L75 83L78 56L105 61L128 43Z"
