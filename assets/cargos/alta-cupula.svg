  <!-- Pixels de destaque -->
  <rect x="49" y="112" width="7" height="7" fill="#FFF3A0" opacity="0.85"/>
  <rect x="200" y="112" width="7" height="7" fill="#FFF3A0" opacity="0.75"/>

</svg>
