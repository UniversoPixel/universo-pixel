<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Ouro principal -->
    <linearGradient id="gold" x1="52" y1="48" x2="204" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6A8"/>
      <stop offset="0.22" stop-color="#FFD95A"/>
      <stop offset="0.5" stop-color="#F2B72B"/>
      <stop offset="0.78" stop-color="#C88712"/>
      <stop offset="1" stop-color="#8F5B08"/>
    </linearGradient>

    <!-- Ouro claro -->
    <linearGradient id="goldLight" x1="74" y1="65" x2="180" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE0"/>
      <stop offset="0.35" stop-color="#FFE978"/>
      <stop offset="0.7" stop-color="#F4BE35"/>
      <stop offset="1" stop-color="#B8730D"/>
    </linearGradient>

    <!-- Sombra -->
    <linearGradient id="shadow" x1="80" y1="150" x2="181" y2="207" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9680A"/>
      <stop offset="1" stop-color="#633B05"/>
    </linearGradient>

    <!-- Brilho -->
    <linearGradient id="shine" x1="85" y1="74" x2="172" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.9"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowBlur" x="18" y="25" width="220" height="218" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="glow" x="45" y="25" width="166" height="166" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Brilho externo -->
  <path
    d="M128 35L151 72L190 53L183 105L210 132L181 151L174 187H82L75 151L46 132L73 105L66 53L105 72L128 35Z"
    fill="#FFD84D"
    opacity="0.22"
    filter="url(#glow)"
  />

  <!-- Sombra projetada -->
  <path
    d="M61 151L78 194L178 194L195 151L181 166L174 198H82L75 166L61 151Z"
    fill="#000"
    opacity="0.18"
  />

  <!-- COROA PRINCIPAL -->
  <g filter="url(#shadowBlur)">

    <!-- Parte traseira da coroa -->
    <path
      d="M52 82L91 105L128 48L165 105L204 82L187 172H69L52 82Z"
      fill="url(#shadow)"
      stroke="#704505"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Corpo frontal -->
    <path
      d="M54 82L92 105L128 49L164 105L202 82L183 169H73L54 82Z"
      fill="url(#gold)"
      stroke="#9A650B"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- Faixa inferior -->
    <path
      d="M73 145H183L178 169H78L73 145Z"
      fill="url(#shadow)"
      stroke="#855307"
      stroke-width="3"
    />

    <!-- Faixa dourada frontal -->
    <path
      d="M76 143H180L176 160H80L76 143Z"
      fill="url(#goldLight)"
    />

    <!-- Ponta esquerda -->
    <path
      d="M54 82L72 94L78 143L69 169L54 82Z"
      fill="#B9780E"
      opacity="0.9"
    />

    <!-- Ponta central esquerda -->
    <path
      d="M92 105L128 49L128 143H103L92 105Z"
      fill="url(#goldLight)"
      opacity="0.9"
    />

    <!-- Ponta central direita -->
    <path
      d="M128 49L164 105L153 143H128V49Z"
      fill="#C98A18"
      opacity="0.72"
    />

    <!-- Ponta direita -->
    <path
      d="M164 105L202 82L187 169L178 143L164 105Z"
      fill="#A96809"
      opacity="0.9"
    />

    <!-- Reflexo diagonal -->
    <path
      d="M69 91L92 105L128 49L128 75L96 125L77 113L69 91Z"
      fill="url(#shine)"
      opacity="0.65"
    />

    <!-- Joia esquerda -->
    <path
      d="M82 137L91 126L101 137L91 148L82 137Z"
      fill="#FFF3A1"
      stroke="#B77A0D"
      stroke-width="2"
    />

    <!-- Joia central -->
    <path
      d="M117 137L128 123L139 137L128 151L117 137Z"
      fill="#FFFBE0"
      stroke="#B77A0D"
      stroke-width="2"
    />

    <!-- Joia direita -->
    <path
      d="M155 137L165 126L174 137L165 148L155 137Z"
      fill="#FFE978"
      stroke="#A96809"
      stroke-width="2"
    />

    <!-- Pequenos brilhos -->
    <path
      d="M86 71L90 78L97 82L90 86L86 94L82 86L75 82L82 78L86 71Z"
      fill="#FFFDE8"
      opacity="0.9"
    />

    <path
      d="M169 69L172 75L178 78L172 81L169 88L166 81L160 78L166 75L169 69Z"
      fill="#FFFDE8"
      opacity="0.75"
    />

  </g>

  <!-- Brilho superior -->
  <path
    d="M128 34L132 44L142 48L132 52L128 63L124 52L114 48L124 44L128 34Z"
    fill="#FFF9C4"
  />

  <!-- Pixel de destaque -->
  <rect x="45" y="118" width="7" height="7" fill="#FFF4A3" opacity="0.9"/>
  <rect x="204" y="119" width="7" height="7" fill="#FFF4A3" opacity="0.75"/>

</svg>
