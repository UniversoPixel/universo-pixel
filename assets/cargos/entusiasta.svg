<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- AZUL PRINCIPAL -->
    <linearGradient id="cardBlue" x1="54" y1="54" x2="204" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF8FF"/>
      <stop offset="0.22" stop-color="#70DFFF"/>
      <stop offset="0.52" stop-color="#159FE0"/>
      <stop offset="0.8" stop-color="#0872B5"/>
      <stop offset="1" stop-color="#034B82"/>
    </linearGradient>

    <!-- AZUL ESCURO -->
    <linearGradient id="cardDark" x1="48" y1="67" x2="197" y2="207" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07558F"/>
      <stop offset="0.5" stop-color="#063E72"/>
      <stop offset="1" stop-color="#022B52"/>
    </linearGradient>

    <!-- GELO -->
    <linearGradient id="ice" x1="82" y1="73" x2="151" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#DDFBFF"/>
      <stop offset="0.42" stop-color="#8CEBFF"/>
      <stop offset="0.7" stop-color="#2AC6F5"/>
      <stop offset="1" stop-color="#087CC3"/>
    </linearGradient>

    <!-- GELO LATERAL -->
    <linearGradient id="iceSide" x1="101" y1="115" x2="151" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69DDFF"/>
      <stop offset="0.5" stop-color="#159EDB"/>
      <stop offset="1" stop-color="#07558C"/>
    </linearGradient>

    <!-- BRILHO -->
    <linearGradient id="shine" x1="66" y1="53" x2="144" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#DFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- PAPEL DO CARTÃO -->
    <linearGradient id="paper" x1="76" y1="91" x2="190" y2="193" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1FBFF"/>
      <stop offset="1" stop-color="#CDEBF5"/>
    </linearGradient>

    <!-- OURO DO SELO -->
    <linearGradient id="gold" x1="179" y1="57" x2="207" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5A0"/>
      <stop offset="0.35" stop-color="#FFD44D"/>
      <stop offset="0.7" stop-color="#E7A91B"/>
      <stop offset="1" stop-color="#9C6208"/>
    </linearGradient>

    <!-- HALO AZUL -->
    <radialGradient id="halo">
      <stop offset="0" stop-color="#49DFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#18B7EF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#18B7EF" stop-opacity="0"/>
    </radialGradient>

    <!-- SOMBRA -->
    <filter id="shadow" x="22" y="22" width="220" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="8"
        flood-color="#001B35"
        flood-opacity="0.38"
      />
    </filter>

    <!-- GLOW -->
    <filter id="glow" x="35" y="30" width="190" height="205" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

  </defs>


