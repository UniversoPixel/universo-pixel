<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Azul principal -->
    <linearGradient id="blue" x1="61" y1="51" x2="195" y2="211" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF8FF"/>
      <stop offset="0.2" stop-color="#72D9FF"/>
      <stop offset="0.48" stop-color="#269DD5"/>
      <stop offset="0.75" stop-color="#12658F"/>
      <stop offset="1" stop-color="#073B59"/>
    </linearGradient>

    <!-- Azul escuro -->
    <linearGradient id="blueDark" x1="91" y1="115" x2="177" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#126F9F"/>
      <stop offset="0.5" stop-color="#094D72"/>
      <stop offset="1" stop-color="#052E46"/>
    </linearGradient>

    <!-- Branco da página -->
    <linearGradient id="paper" x1="89" y1="63" x2="173" y2="181" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#EAF7FB"/>
      <stop offset="1" stop-color="#BBDDE8"/>
    </linearGradient>

    <!-- Ouro -->
    <linearGradient id="gold" x1="134" y1="104" x2="199" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7B0"/>
      <stop offset="0.2" stop-color="#FFD95A"/>
      <stop offset="0.5" stop-color="#F0B52A"/>
      <stop offset="0.78" stop-color="#C17D0D"/>
      <stop offset="1" stop-color="#855006"/>
    </linearGradient>

    <!-- Ouro claro -->
    <linearGradient id="goldLight" x1="150" y1="102" x2="198" y2="171" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE2"/>
      <stop offset="0.35" stop-color="#FFE979"/>
      <stop offset="0.7" stop-color="#F3BC35"/>
      <stop offset="1" stop-color="#B36D08"/>
    </linearGradient>

    <!-- Brilho -->
    <linearGradient id="shine" x1="82" y1="62" x2="139" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.9"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowBlur" x="25" y="28" width="211" height="215" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="116" y="78" width="112" height="137" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Halo da pena -->
  <path
    d="M158 89L203 126L217 178L177 214L134 188L158 89Z"
    fill="#FFD94D"
    opacity="0.16"
    filter="url(#glow)"
  />

  <!-- Sombra -->
  <path
    d="M54 177L78 207L158 207L192 184L174 202L157 216H81L62 195L54 177Z"
    fill="#000"
    opacity="0.17"
  />

