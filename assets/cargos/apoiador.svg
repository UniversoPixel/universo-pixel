<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Azul principal -->
    <linearGradient id="rocketBlue" x1="72" y1="54" x2="190" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF9FF"/>
      <stop offset="0.2" stop-color="#72D9FF"/>
      <stop offset="0.48" stop-color="#269DD5"/>
      <stop offset="0.75" stop-color="#12658F"/>
      <stop offset="1" stop-color="#063B5A"/>
    </linearGradient>

    <!-- Azul claro -->
    <linearGradient id="rocketLight" x1="91" y1="65" x2="154" y2="143" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#BDF4FF"/>
      <stop offset="0.62" stop-color="#55CFFF"/>
      <stop offset="1" stop-color="#168DCA"/>
    </linearGradient>

    <!-- Azul escuro -->
    <linearGradient id="rocketDark" x1="102" y1="125" x2="166" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B79B3"/>
      <stop offset="0.55" stop-color="#07547F"/>
      <stop offset="1" stop-color="#03364F"/>
    </linearGradient>

    <!-- Branco -->
    <linearGradient id="whiteMetal" x1="92" y1="100" x2="161" y2="159" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E9F8FC"/>
      <stop offset="1" stop-color="#B7DDE7"/>
    </linearGradient>

    <!-- Ouro -->
    <linearGradient id="gold" x1="106" y1="150" x2="155" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7AE"/>
      <stop offset="0.25" stop-color="#FFD95A"/>
      <stop offset="0.55" stop-color="#F1B62B"/>
      <stop offset="0.8" stop-color="#C47F0D"/>
      <stop offset="1" stop-color="#835006"/>
    </linearGradient>

    <!-- Fogo -->
    <linearGradient id="fire" x1="112" y1="166" x2="145" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9A8"/>
      <stop offset="0.35" stop-color="#FFD33D"/>
      <stop offset="0.7" stop-color="#FF8A22"/>
      <stop offset="1" stop-color="#E94B16"/>
    </linearGradient>

    <!-- Brilho -->
    <linearGradient id="shine" x1="82" y1="59" x2="140" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.95"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Halo -->
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4CCFFF" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#229ED4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#229ED4" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowBlur" x="22" y="22" width="213" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="39" y="27" width="177" height="207" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Halo -->
  <ellipse
    cx="128"
    cy="126"
    rx="82"
    ry="94"
    fill="url(#halo)"
    filter="url(#glow)"
  />

  <!-- Sombra -->
  <path
    d="M65 185L90 211L165 211L192 181L173 202L158 216H93L78 202L65 185Z"
    fill="#000000"
    opacity="0.18"
  />

