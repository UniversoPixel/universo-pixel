  <!-- Pixels decorativos -->
  <rect x="42" y="91" width="7" height="7" fill="#8BE7FF" opacity="0.8"/>
  <rect x="181" y="67" width="7" height="7" fill="#FFF1A0" opacity="0.8"/>
  <rect x="205" y="154" width="6" height="6" fill="#FFE879" opacity="0.7"/>

