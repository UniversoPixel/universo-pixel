  <!-- Pixels de velocidade -->
  <rect x="46" y="157" width="7" height="7" fill="#67D9FF" opacity="0.8"/>
  <rect x="55" y="174" width="5" height="5" fill="#A9EEFF" opacity="0.7"/>
  <rect x="201" y="149" width="7" height="7" fill="#6BD8FF" opacity="0.75"/>
  <rect x="194" y="169" width="5" height="5" fill="#B4F1FF" opacity="0.65"/>

