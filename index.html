    :root {

      --text-muted: #94a3b8;

      --border: #d5e7f4;
      --border-dark: #a9cce4;

      --shadow:
        0 12px 35px rgba(23, 108, 168, .15);

      --shadow-heavy:

    * {

    }

    html,
    body {

      width: 100%;
      min-height: 100%;

      position: relative;

    body::before {

      content: "";

      inset: 0;

      pointer-events: none;

        linear-gradient(

    .font-title {

    }

       NUVENS

    .cloud {

      position: absolute;

      pointer-events: none;

      user-select: none;

      color: white;

      opacity: .65;

      filter:
        drop-shadow(
          0 8px 10px rgba(23,108,168,.05)

    }

    .cloud-1 {

      top: 7%;

      left: -30px;

      font-size: 75px;

      animation:
        floatCloud 22s ease-in-out infinite;

    }

    .cloud-2 {

      top: 13%;

      right: -35px;

      font-size: 100px;

      opacity: .42;

      animation:
        floatCloudReverse 27s ease-in-out infinite;

    }

    .cloud-3 {

      bottom: 14%;

      left: 4%;

      font-size: 65px;

      opacity: .55;

      animation:
        floatCloud 19s ease-in-out infinite;

    }

    .cloud-4 {

      bottom: 8%;

      right: 3%;

      font-size: 85px;

      opacity: .48;

      animation:
        floatCloudReverse 23s ease-in-out infinite;

    }

    @keyframes floatCloud {

      0%,
      100% {
        transform: translateX(-15px);
      }

      50% {
        transform: translateX(25px);
      }

    }

    @keyframes floatCloudReverse {

      0%,
      100% {
        transform: translateX(20px);
      }

      50% {
        transform: translateX(-25px);
      }

    }
