<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelizados - Home</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Favicon para a aba do navegador -->
  <link rel="icon" type="image/png" href="icon.png.PNG" />

  <!-- Estilos Personalizados -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap');

    .font-pixel {
      font-family: 'Press Start 2P', cursive;
    }

    .font-sans {
      font-family: 'Inter', sans-serif;
    }

    /* Renderização nítida de imagens Pixel Art */
    .pixel-art {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center font-sans antialiased p-4">

  <!-- Main Container Totalmente Alinhado e Centralizado -->
  <main class="w-full max-w-md mx-auto flex flex-col items-center justify-center text-center">

    <!-- Card da Home -->
    <div class="w-full flex flex-col items-center justify-center">

      <!-- Ícone Pixel Art (Borda Fina, Sombra Suave e Efeito Hover) -->
      <div class="w-full flex justify-center items-center my-4">
        <div class="p-2 bg-white/20 backdrop-blur-md rounded-2xl border border-white/40 shadow-md shadow-sky-900/10 hover:shadow-lg hover:shadow-sky-500/20 transition-all duration-300 group cursor-pointer">
          <img 
            src="icon.png.PNG" 
            alt="Pixelizados Icon" 
            class="h-16 md:h-20 w-auto object-contain pixel-art rounded-xl group-hover:scale-105 transition-transform duration-300 ease-out block mx-auto"
          />
        </div>
      </div>

    </div>

  </main>

</body>
</html>
