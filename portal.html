<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal | Universo Pixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      /* BACKGROUND AZUL CÉU VIBRANTE (ESTILO HABBO) */
      background: linear-gradient(180deg, #2bb7f6 0%, #179be3 100%);
      background-attachment: fixed;
      color: #ffffff;
    }

    /* BASE AMARELO HABBO */
    .bg-habbo-yellow {
      background: linear-gradient(180deg, #ffcb05 0%, #ffb400 100%);
      border-bottom: 2px solid #cc8e00;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
    }

    /* WIDGET MODERNO: CRISTAL / GLASS FLUTUANTE */
    .glass-capsule {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 4px 14px -2px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(0, 119, 204, 0.15);
    }

    .glass-capsule-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-capsule-hover:hover {
      background: rgba(255, 255, 255, 1);
      transform: translateY(-2px);
      box-shadow: 
        0 8px 20px -4px rgba(0, 0, 0, 0.15),
        0 0 12px 2px rgba(255, 255, 255, 0.5);
      border-color: #ffffff;
    }

    /* DISCO DE DJ PIXELIZADO EM ROTAÇÃO CONTINUA */
    @keyframes spin-record {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pixel-vinyl-spin {
      animation: spin-record 3s linear infinite;
    }

    /* MOEDA PIXELIZADA DOURADA HABBO */
    .habbo-coin {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #ffe066 30%, #f59e0b 80%, #b45309 100%);
      border: 1.5px solid #78350f;
      box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px #92400e, 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Brilho pulsante LIVE */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }

    /* FAIXA COLORIDA VIBRANTE COM 90% DE TRANSPARÊNCIA */
    .nav-banner-vibrant {
      background: rgba(0, 119, 204, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 20px rgba(0, 80, 150, 0.25);
    }

    /* ESTILO BASE DOS BOTÕES COLORIDOS */
    .btn-shortcut {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .btn-shortcut:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      filter: brightness(1.08);
    }

    .btn-shortcut:hover i {
      transform: scale(1.2) rotate(-5deg);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER AMARELO HABBO -->
  <header class="bg-habbo-yellow px-4 sm:px-8 py-3 relative z-20">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      
      <!-- ESQUERDA: AUTODJ -->
      <div class="glass-capsule glass-capsule-hover rounded-full p-1.5 pr-5 flex items-center gap-3.5 w-full md:w-auto">
        <div class="relative flex-shrink-0">
          <div class="w-10 h-10 rounded-full p-0.5 bg-gradient-to-tr from-[#38b6ff] to-cyan-300 shadow-md">
            <img 
              id="dj-avatar" 
              src="https://api.dicebear.com/7.x/pixel-art/svg?seed=AutoDJ&backgroundColor=38b6ff" 
              alt="DJ Avatar" 
              class="w-full h-full rounded-full object-cover bg-slate-900"
            >
          </div>
          <span class="absolute -bottom-0.5 -right-0.5 flex h-3.5 w-3.5">
            <span class="pulse-ring absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-rose-500 border-2 border-white"></span>
          </span>
        </div>

        <div class="flex flex-col justify-center leading-tight">
          <div class="flex items-center gap-2">
            <span class="bg-[#38b6ff]/15 text-[#0077cc] text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full border border-[#38b6ff]/30 flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded-full bg-slate-900 border border-sky-400 flex items-center justify-center pixel-vinyl-spin">
                <span class="w-1 h-1 rounded-full bg-amber-400"></span>
              </span>
              <span>NO AR</span>
            </span>
            <p class="text-xs font-black text-slate-900 tracking-tight">
              <span id="dj-name">AutoDJ Pixel</span>
            </p>
          </div>
          <div class="flex items-center gap-1.5 mt-1 text-[11px] font-medium text-slate-600">
            <i class="fa-solid fa-record-vinyl text-[#38b6ff] pixel-vinyl-spin text-[12px]"></i>
            <span id="track-name" class="truncate max-w-[200px] sm:max-w-[260px] font-semibold text-slate-800">
              Universo Pixel - Tocando as melhores!
            </span>
          </div>
        </div>
      </div>

      <!-- DIREITA: PERFIL + MOEDA HABBO -->
      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <div class="glass-capsule glass-capsule-hover rounded-full p-1.5 flex items-center gap-3">
          
          <div class="flex items-center gap-2 bg-gradient-to-r from-amber-50 to-yellow-100/80 px-3 py-1 rounded-full border border-amber-200/80 shadow-inner">
            <div class="habbo-coin rounded-full flex-shrink-0 flex items-center justify-center font-black text-[9px] text-amber-950 select-none">
              $
            </div>
            <div class="flex items-center gap-1 leading-none">
              <span id="user-pixels" class="font-black text-xs text-amber-950">0</span>
              <span class="text-[9px] font-black text-amber-700 tracking-wider">PX</span>
            </div>
          </div>

          <div class="h-5 w-[1px] bg-slate-200"></div>

          <div class="flex items-center gap-2 pr-2">
            <div 
              onclick="abrirModalAvatar()" 
              title="Alterar foto de perfil" 
              class="relative group cursor-pointer w-8 h-8 rounded-full p-0.5 bg-gradient-to-tr from-[#38b6ff] to-sky-200 shadow-sm transition hover:scale-105"
            >
              <img 
                id="user-avatar" 
                src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Pixelizado" 
                alt="Avatar do Usuário"
                class="w-full h-full rounded-full object-cover bg-slate-800"
              >
              <div class="absolute inset-0 rounded-full bg-[#0077cc]/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-[10px]">
                <i class="fa-solid fa-camera"></i>
              </div>
            </div>

            <div class="flex flex-col">
              <p id="user-nick" class="font-black text-xs text-slate-900 truncate max-w-[110px]">
                Pixelizado
              </p>
              <div class="flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Online</span>
              </div>
            </div>
          </div>

        </div>

        <button 
          onclick="fazerLogout()" 
          title="Sair do Portal" 
          class="glass-capsule glass-capsule-hover w-11 h-11 rounded-full flex items-center justify-center text-slate-600 hover:text-rose-600 hover:border-rose-300 transition group"
        >
          <i class="fa-solid fa-power-off text-sm group-hover:scale-110 transition-transform"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- FAIXA DE NAVEGAÇÃO COLORIDA & VIBRANTE -->
  <nav class="nav-banner-vibrant w-full px-4 sm:px-8 py-3 relative z-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between overflow-x-auto no-scrollbar gap-3 py-0.5">
      
      <!-- Home (Amarelo) -->
      <a href="#" class="btn-shortcut bg-amber-400 hover:bg-amber-300 text-slate-900 border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-house text-amber-900 text-sm transition-transform"></i>
        <span>Home</span>
      </a>

      <!-- Comunidade (Rosa) -->
      <a href="#" class="btn-shortcut bg-pink-500 hover:bg-pink-400 text-white border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-users text-pink-100 text-sm transition-transform"></i>
        <span>Comunidade</span>
      </a>

      <!-- Equipe (Verde) -->
      <a href="#" class="btn-shortcut bg-emerald-400 hover:bg-emerald-300 text-slate-950 border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-user-shield text-emerald-950 text-sm transition-transform"></i>
        <span>Equipe</span>
      </a>

      <!-- Ranking (Laranja / Ouro) -->
      <a href="#" class="btn-shortcut bg-orange-400 hover:bg-orange-300 text-slate-950 border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-trophy text-orange-950 text-sm transition-transform"></i>
        <span>Ranking</span>
      </a>

      <!-- Notícias (Roxo) -->
      <a href="#" class="btn-shortcut bg-purple-500 hover:bg-purple-400 text-white border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-newspaper text-purple-100 text-sm transition-transform"></i>
        <span>Notícias</span>
      </a>

      <!-- Discord (Azul Discord Oficial) -->
      <a href="#" target="_blank" class="btn-shortcut bg-[#5865F2] hover:bg-[#4752C4] text-white border-2 border-white/80 px-4 py-2 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold whitespace-nowrap">
        <i class="fa-brands fa-discord text-white text-sm transition-transform"></i>
        <span>Discord</span>
      </a>

    </div>
  </nav>

  <!-- MODAL DE ALTERAÇÃO DA FOTO DE PERFIL -->
  <div id="modal-avatar" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl relative text-left">
      <button onclick="fecharModalAvatar()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 class="font-bold text-base text-white mb-1">Editar Foto de Perfil</h3>
      <p class="text-xs text-slate-400 mb-3">Cole a URL da sua imagem (PNG, JPG ou GIF) abaixo:</p>

      <input 
        type="url" 
        id="input-avatar-url" 
        placeholder="https://exemplo.com/sua-foto.png"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#38b6ff] mb-4"
      >

      <div class="flex gap-2">
        <button onclick="fecharModalAvatar()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition">
          Cancelar
        </button>
        <button onclick="salvarNovoAvatar()" class="w-1/2 bg-[#38b6ff] hover:bg-sky-400 text-white font-bold py-2 rounded-xl text-xs transition">
          Salvar
        </button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <!-- Conteúdo principal do portal -->
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userData = JSON.parse(localStorage.getItem('pixelizados_user')) || {};

      const discordTag = userData.discord_tag || 'Pixelizado';
      document.getElementById('user-nick').innerText = discordTag;

      const avatarSalvo = localStorage.getItem('custom_user_avatar');
      if (avatarSalvo) {
        document.getElementById('user-avatar').src = avatarSalvo;
      } else {
        document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(discordTag)}`;
      }
    });

    function abrirModalAvatar() {
      document.getElementById('modal-avatar').classList.remove('hidden');
    }

    function fecharModalAvatar() {
      document.getElementById('modal-avatar').classList.add('hidden');
    }

    function salvarNovoAvatar() {
      const url = document.getElementById('input-avatar-url').value.trim();
      if (url) {
        localStorage.setItem('custom_user_avatar', url);
        document.getElementById('user-avatar').src = url;
        fecharModalAvatar();
      } else {
        alert('Por favor, insira uma URL válida para a imagem.');
      }
    }

    function fazerLogout() {
      localStorage.removeItem('pixelizados_user');
      localStorage.removeItem('custom_user_avatar');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
