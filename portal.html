<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal | Universo Pixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0d131f;
      color: #ffffff;
    }

    /* AMARELO PASTEL SUAVE COM GRID QUADRICULADO LEVE */
    .bg-pixel-yellow-soft {
      background-color: #f7d060;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 12px 12px;
    }

    /* Borda sutil e elegante */
    .border-yellow-subtle {
      border-bottom: 2px solid rgba(0, 0, 0, 0.12);
    }

    /* Widget Estilo Habbo Sky Minimalista */
    .widget-sky-card {
      background-color: rgba(13, 19, 31, 0.85);
      border: 1px solid rgba(56, 182, 255, 0.4);
      backdrop-filter: blur(8px);
    }

    .widget-sky-card:hover {
      border-color: rgba(56, 182, 255, 0.7);
    }
  </style>
</head>
<body class="min-h-screen bg-[#0d131f]">

  <!-- HEADER AMARELO PASTEL QUADRICULADO SUAVE -->
  <header class="bg-pixel-yellow-soft border-yellow-subtle px-4 sm:px-8 py-2.5 relative z-20 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      
      <!-- CANTO ESQUERDO: AUTODJ / RÁDIO -->
      <div class="flex items-center gap-3 widget-sky-card px-3.5 py-1.5 rounded-xl w-full md:w-auto transition shadow-sm">
        <!-- Foto/Avatar do DJ -->
        <div class="relative">
          <img 
            id="dj-avatar" 
            src="https://api.dicebear.com/7.x/pixel-art/svg?seed=AutoDJ&backgroundColor=38b6ff" 
            alt="DJ Avatar" 
            class="w-9 h-9 rounded-lg bg-sky-950 border border-sky-400/40 object-cover"
          >
          <span class="absolute -bottom-1 -right-1 bg-rose-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full border border-slate-900 animate-pulse">
            LIVE
          </span>
        </div>

        <!-- Info do DJ & Tracklist -->
        <div class="flex flex-col justify-center text-xs">
          <div class="flex items-center gap-1.5 font-bold uppercase tracking-wider text-[10px] text-sky-300">
            <i class="fa-solid fa-radio text-rose-400 text-[11px]"></i>
            <span>DJ: <span id="dj-name" class="text-white font-extrabold">AutoDJ Pixel</span></span>
          </div>
          <div class="flex items-center gap-1 mt-0.5 text-slate-300 font-normal text-[11px]">
            <i class="fa-solid fa-music text-[9px] text-sky-400"></i>
            <span id="track-name" class="truncate max-w-[180px] sm:max-w-[240px]">Universo Pixel - Tocando as melhores!</span>
          </div>
        </div>
      </div>

      <!-- CANTO DIREITO: PERFIL MINIMALISTA EM AZUL HABBO -->
      <div class="flex items-center gap-2.5 w-full md:w-auto justify-end">
        
        <!-- Saldo de Pixels Minimalista -->
        <div class="flex items-center gap-1.5 widget-sky-card px-3 py-1.5 rounded-xl transition">
          <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
          <span id="user-pixels" class="font-extrabold text-xs text-white">0</span>
          <span class="text-[9px] font-bold text-sky-300/80 tracking-wider">PX</span>
        </div>

        <!-- Perfil do Usuário Compacto -->
        <div class="flex items-center gap-2.5 widget-sky-card p-1 pr-3 rounded-xl transition">
          <!-- Avatar Editável -->
          <div onclick="abrirModalAvatar()" title="Alterar foto de perfil" class="relative group cursor-pointer w-7 h-7 rounded-lg bg-sky-950 flex items-center justify-center overflow-hidden border border-sky-400/50">
            <img 
              id="user-avatar" 
              src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Pixelizado" 
              alt="Avatar do Usuário"
              class="w-full h-full object-cover group-hover:opacity-40 transition"
            >
            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-sky-300 text-[10px]">
              <i class="fa-solid fa-camera"></i>
            </div>
          </div>

          <p id="user-nick" class="font-semibold text-xs text-white truncate max-w-[120px]">Pixelizado</p>
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400" title="Online"></span>
        </div>

        <!-- Botão Sair Minimalista -->
        <button onclick="fazerLogout()" title="Sair" class="widget-sky-card hover:bg-rose-600 hover:border-rose-500 text-slate-300 hover:text-white p-2 rounded-xl transition">
          <i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- MODAL DE ALTERAÇÃO DA FOTO DE PERFIL -->
  <div id="modal-avatar" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl relative text-left">
      <button onclick="fecharModalAvatar()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 class="font-bold text-base text-white mb-1">Editar Foto de Perfil</h3>
      <p class="text-xs text-slate-400 mb-3">Cole a URL da sua imagem (PNG, JPG ou GIF) abaixo:</p>

      <input 
        type="url" 
        id="input-avatar-url" 
        placeholder="https://exemplo.com/sua-foto.png"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 mb-4"
      >

      <div class="flex gap-2">
        <button onclick="fecharModalAvatar()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition">
          Cancelar
        </button>
        <button onclick="salvarNovoAvatar()" class="w-1/2 bg-sky-400 hover:bg-sky-300 text-slate-900 font-bold py-2 rounded-xl text-xs transition">
          Salvar
        </button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <!-- Próximas seções do portal aqui -->
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userData = JSON.parse(localStorage.getItem('pixelizados_user')) || {};

      const discordTag = userData.discord_tag || 'Pixelizado';
      document.getElementById('user-nick').innerText = discordTag;

      const avatarSalvo = localStorage.getItem('custom_user_avatar');
      if (avatarSalvo) {
        document.getElementById('user-avatar').src = avatarSalvo;
      } else {
        document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(discordTag)}`;
      }
    });

    function abrirModalAvatar() {
      document.getElementById('modal-avatar').classList.remove('hidden');
    }

    function fecharModalAvatar() {
      document.getElementById('modal-avatar').classList.add('hidden');
    }

    function salvarNovoAvatar() {
      const url = document.getElementById('input-avatar-url').value.trim();
      if (url) {
        localStorage.setItem('custom_user_avatar', url);
        document.getElementById('user-avatar').src = url;
        fecharModalAvatar();
      } else {
        alert('Por favor, insira uma URL válida para a imagem.');
      }
    }

    function fazerLogout() {
      localStorage.removeItem('pixelizados_user');
      localStorage.removeItem('custom_user_avatar');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
