<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal | Universo Pixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0d131f;
      color: #ffffff;
    }

    /* Textura Granulada Retrô para o Header Amarelo */
    .bg-header-yellow {
      background-color: #fbc02d;
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 0),
        linear-gradient(to bottom, #fdd835, #f57f17);
      background-size: 4px 4px, 100% 100%;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0d131f]">

  <!-- HEADER RETRÔ AMARELO GRANULADO -->
  <header class="bg-header-yellow border-b-4 border-black/20 text-slate-900 px-4 sm:px-8 py-3 shadow-lg relative z-20">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- CANTO ESQUERDO: AUTODJ / RÁDIO -->
      <div class="flex items-center gap-3 bg-black/10 backdrop-blur-sm p-2 rounded-2xl border border-black/10 w-full md:w-auto">
        <!-- Foto/Avatar do DJ -->
        <div class="relative">
          <img 
            id="dj-avatar" 
            src="https://api.dicebear.com/7.x/pixel-art/svg?seed=AutoDJ&backgroundColor=b6e3f4" 
            alt="DJ Avatar" 
            class="w-12 h-12 rounded-xl bg-amber-200/80 border-2 border-slate-900/40 object-cover"
          >
          <span class="absolute -bottom-1 -right-1 bg-rose-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full border border-slate-900 animate-pulse">
            LIVE
          </span>
        </div>

        <!-- Info do DJ & Tracklist -->
        <div class="flex flex-col justify-center text-xs">
          <div class="flex items-center gap-1.5 font-extrabold text-slate-900 uppercase tracking-wide">
            <i class="fa-solid fa-radio text-rose-700"></i>
            <span>DJ: <span id="dj-name" class="text-black">AutoDJ Pixel</span></span>
          </div>
          <div class="flex items-center gap-1 mt-0.5 text-slate-800 font-medium">
            <i class="fa-solid fa-music text-[10px] text-slate-700"></i>
            <span id="track-name" class="truncate max-w-[180px] sm:max-w-[240px]">Universo Pixel - Tocando as melhores!</span>
          </div>
        </div>
      </div>

      <!-- CANTO DIREITO: PERFIL DO USER (DISCORD NICK) + PIXELS -->
      <div class="flex items-center gap-4 w-full md:w-auto justify-end">
        
        <!-- Saldo de Pixels -->
        <div class="flex items-center gap-2 bg-slate-900/90 text-amber-400 px-3 py-1.5 rounded-xl border border-amber-400/30 shadow-inner">
          <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
          <div class="text-right leading-none">
            <span id="user-pixels" class="font-extrabold text-sm text-white">0</span>
            <span class="block text-[9px] text-amber-300/80 font-bold tracking-wider">PIXELS</span>
          </div>
        </div>

        <!-- User Info + Avatar Editável -->
        <div class="flex items-center gap-3 bg-slate-900/90 p-1.5 pr-3 rounded-2xl border border-slate-800">
          
          <!-- Avatar Clicável com Botão de Edição -->
          <div onclick="abrirModalAvatar()" title="Alterar foto de perfil" class="relative group cursor-pointer w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center overflow-hidden border border-slate-700 hover:border-amber-400 transition">
            <img 
              id="user-avatar" 
              src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Pixelizado" 
              alt="Avatar do Usuário"
              class="w-full h-full object-cover group-hover:opacity-40 transition"
            >
            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition bg-black/50 text-amber-400 text-xs">
              <i class="fa-solid fa-camera"></i>
            </div>
          </div>

          <div class="text-left">
            <p id="user-nick" class="font-bold text-xs text-white leading-tight">Pixelizado</p>
            <span class="text-[10px] font-semibold text-emerald-400 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> On-line
            </span>
          </div>
        </div>

        <!-- Botão de Sair -->
        <button onclick="fazerLogout()" title="Sair" class="bg-slate-900/80 hover:bg-rose-600 text-white p-2.5 rounded-xl border border-slate-800 transition">
          <i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- MODAL DE ALTERAÇÃO DA FOTO DE PERFIL -->
  <div id="modal-avatar" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative text-left">
      <button onclick="fecharModalAvatar()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 class="font-bold text-lg text-white mb-1">Editar Foto de Perfil</h3>
      <p class="text-xs text-slate-400 mb-4">Cole a URL da sua imagem (PNG, JPG ou GIF) abaixo:</p>

      <input 
        type="url" 
        id="input-avatar-url" 
        placeholder="https://exemplo.com/sua-foto.png"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 mb-4"
      >

      <div class="flex gap-2">
        <button onclick="fecharModalAvatar()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-xl text-xs transition">
          Cancelar
        </button>
        <button onclick="salvarNovoAvatar()" class="w-1/2 bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold py-2 rounded-xl text-xs transition">
          Salvar
        </button>
      </div>
    </div>
  </div>

  <!-- ÁREA PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    <!-- Próximas seções aqui -->
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userData = JSON.parse(localStorage.getItem('pixelizados_user')) || {};

      // Pega a Tag do Discord
      const discordTag = userData.discord_tag || 'Pixelizado';
      document.getElementById('user-nick').innerText = discordTag;

      // Se o utilizador tiver uma foto salva no localStorage usa ela, senão gera o avatar Pixel Art
      const avatarSalvo = localStorage.getItem('custom_user_avatar');
      if (avatarSalvo) {
        document.getElementById('user-avatar').src = avatarSalvo;
      } else {
        document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(discordTag)}`;
      }
    });

    function abrirModalAvatar() {
      document.getElementById('modal-avatar').classList.remove('hidden');
    }

    function fecharModalAvatar() {
      document.getElementById('modal-avatar').classList.add('hidden');
    }

    function salvarNovoAvatar() {
      const url = document.getElementById('input-avatar-url').value.trim();
      if (url) {
        localStorage.setItem('custom_user_avatar', url);
        document.getElementById('user-avatar').src = url;
        fecharModalAvatar();
      } else {
        alert('Por favor, insere uma URL válida para a imagem.');
      }
    }

    function fazerLogout() {
      localStorage.removeItem('pixelizados_user');
      localStorage.removeItem('custom_user_avatar');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
